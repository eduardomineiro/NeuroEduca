<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memória Visual</title>
  <link rel="stylesheet" href="responsive.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: linear-gradient(to bottom, #e0f7fa, #f1f8e9); color: #2a5d84; }
    h1 { color: #00796b; }
    .grid { display: grid; justify-content: center; margin-top: 20px; }
    .card { background-color: #d3ecf7; border-radius: 10px; cursor: pointer; user-select: none; box-shadow: 1px 1px 4px #888; }
    .back { display: inline-block; padding: 10px 20px; background-color: #4dd0e1; color: white; border-radius: 12px; text-decoration: none; box-shadow: 2px 2px 6px #888; }
    .back:hover { background-color: #0097a7; }
  </style>
</head>
<body>
  <h1>🧠 Memória Visual</h1>
  <div id="game" class="grid"></div>
  <p id="status">Pares encontrados: 0</p>
  <a href="index.html" class="back">← Voltar ao menu</a>
  <script>
    const emojis = ['🍎','🍊','🍇','🍉','🍌','🍓','🍒','🥝'];
    let cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
    const state = { revealed: [], matched: [], pairs: 0 };
    const game = document.getElementById('game');
    const status = document.getElementById('status');
    function render() {
      game.innerHTML = '';
      cards.forEach((emoji, i) => {
        const card = document.createElement('button');
        card.className = 'card';
        card.type = 'button';
        card.textContent = state.matched.includes(i) || state.revealed.includes(i) ? emoji : '❓';
        card.setAttribute('aria-label', 'Carta ' + (i + 1));
        card.onclick = () => flip(i);
        game.appendChild(card);
      });
      status.textContent = `Pares encontrados: ${state.pairs}`;
    }
    function flip(index) {
      if (state.revealed.length === 2 || state.matched.includes(index) || state.revealed.includes(index)) return;
      state.revealed.push(index);
      if (state.revealed.length === 2) {
        const [a, b] = state.revealed;
        if (cards[a] === cards[b]) { state.matched.push(a, b); state.pairs++; }
        setTimeout(() => { state.revealed = []; render(); }, 1000);
      }
      render();
    }
    render();
  </script>
</body>
</html>
